name: Psalm

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  psalm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install WooCommerce dependencies
        working-directory: plugins/woocommerce
        run: composer install --no-interaction --prefer-dist

      - name: Install Psalm
        working-directory: plugins/woocommerce
        run: |
          composer bin psalm require --dev "vimeo/psalm:^6" -W

      - name: Apply temporary Psalm compatibility changes
        working-directory: plugins/woocommerce
        run: |
          # Replace PHPDoc callable syntax that Psalm cannot parse.
          sed -i \
            's/@var callable( mixed $input= ): (mixed|WP_Error)/@var callable(mixed=): (mixed|WP_Error)/' \
            vendor/wordpress/abilities-api/includes/abilities-api/class-wp-ability.php

          sed -i \
            's/@var callable( mixed $input= ): (bool|WP_Error)/@var callable(mixed=): (bool|WP_Error)/' \
            vendor/wordpress/abilities-api/includes/abilities-api/class-wp-ability.php

          # Prevent Psalm from scanning the problematic WooCommerce implementation.
          # psalm.xml uses psalm-stubs/UnsecuredReportFiles.phpstub instead.
          mv \
            src/Internal/Admin/Notes/UnsecuredReportFiles.php \
            src/Internal/Admin/Notes/UnsecuredReportFiles.php.disabled

      - name: Run Psalm
        id: psalm
        continue-on-error: true
        working-directory: plugins/woocommerce
        run: |
          vendor/bin/psalm \
            --config=psalm.xml \
            --no-cache \
            --report=psalm-results.sarif

      - name: Upload Psalm results to GitHub Code Scanning
        if: always() && hashFiles('plugins/woocommerce/psalm-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: plugins/woocommerce/psalm-results.sarif
          category: psalm

      - name: Fail workflow if Psalm found issues
        if: steps.psalm.outcome == 'failure'
        run: exit 1
