name: OWASP Dependency Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run OWASP Dependency Check
        id: dependency_check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: 'WooCommerce'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-reports'
          args: >
            --format SARIF
            --failOnCVSS 7
            --exclude "**/node_modules/**"
            --exclude "**/vendor/**"
            --disableNodeAudit
            --disableNodeJS
            --disableYarnAudit
            --ossIndexUrl "https://api.guide.sonatype.com"
            --ossIndexUser "${{ vars.SONATYPE_GUIDE_USER }}"
            --ossIndexPassword "${{ secrets.SONATYPE_GUIDE_PAT }}"

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-reports/

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('dependency-check-reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dependency-check-reports/dependency-check-report.sarif
          category: dependency-check

      - name: Fail workflow if Dependency Check found high severity vulnerabilities
        if: steps.dependency_check.outcome == 'failure'
        run: exit 1
