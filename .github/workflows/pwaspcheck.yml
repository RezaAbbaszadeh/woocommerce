name: OWASP Dependency Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run OWASP Dependency Check
        id: dependency_check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'WooCommerce'
          path: 'plugins/woocommerce'
          format: 'SARIF'
          args: >
            --failOnCVSS 7
            --exclude "**/node_modules/**"
            --exclude "**/vendor/**"
            --disableNodeAudit
            --disableNodeJS
            --disableYarnAudit
            --ossIndexUrl https://api.guide.sonatype.com
            --ossIndexPassword "${{ secrets.SONATYPE_GUIDE_PAT }}"

      - name: Upload Dependency Check results
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      - name: Fail workflow if high severity vulnerabilities were found
        if: steps.dependency_check.outcome == 'failure'
        run: exit 1
